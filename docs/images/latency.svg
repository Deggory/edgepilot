<svg xmlns="http://www.w3.org/2000/svg" width="760" height="236" viewBox="0 0 760 236" role="img">
<style>
  .t { font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
  .s { font: 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #59636e; }
  .h { font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
  .grid { stroke: #d1d9e0; stroke-width: 1; }
  .axis { stroke: #818b98; stroke-width: 1; }
  .bar-label { font: 600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #ffffff; }
</style>
<rect x="0.5" y="0.5" width="759" height="235" rx="8" fill="#ffffff" stroke="#d1d9e0"/>
<text class="h" x="24" y="26">One camera frame to a steering command</text>
<text class="s" x="24" y="45">Measured on the board. Frames arrive every 50 ms (20 Hz); controlsd runs every 10 ms and uses the newest model output.</text>
<line class="axis" x1="24.0" y1="76" x2="713.2" y2="76"/>
<line class="axis" x1="24.0" y1="72" x2="24.0" y2="80"/>
<line class="axis" x1="713.2" y1="72" x2="713.2" y2="80"/>
<text class="t" x="713.2" y="70" text-anchor="end">exposure to steering command ≤ 73 ms</text>
<line class="axis" x1="24.0" y1="98" x2="618.3" y2="98"/>
<line class="axis" x1="24.0" y1="94" x2="24.0" y2="102"/>
<line class="axis" x1="618.3" y1="94" x2="618.3" y2="102"/>
<text class="t" x="618.3" y="92" text-anchor="end">exposure to model output ≈ 63 ms</text>
<rect x="24.0" y="112" width="409.2" height="32" fill="#1f9e9a"/>
<text class="bar-label" x="228.6" y="133" text-anchor="middle">43.1 ms</text>
<rect x="433.2" y="112" width="9.5" height="32" fill="#a371f7"/>
<rect x="442.7" y="112" width="147.1" height="32" fill="#2f81f7"/>
<text class="bar-label" x="516.2" y="133" text-anchor="middle">15.5 ms</text>
<rect x="589.8" y="112" width="28.5" height="32" fill="#6e9fe6"/>
<rect x="618.3" y="112" width="94.9" height="32" fill="#f0883e"/>
<text class="bar-label" x="665.7" y="133" text-anchor="middle">≤ 10 ms</text>
<line class="axis" x1="24.0" y1="150" x2="736.0" y2="150"/>
<line class="axis" x1="24.0" y1="150" x2="24.0" y2="154"/>
<text class="s" x="24.0" y="167" text-anchor="middle">0 ms</text>
<line class="axis" x1="118.9" y1="150" x2="118.9" y2="154"/>
<text class="s" x="118.9" y="167" text-anchor="middle">10 ms</text>
<line class="axis" x1="213.9" y1="150" x2="213.9" y2="154"/>
<text class="s" x="213.9" y="167" text-anchor="middle">20 ms</text>
<line class="axis" x1="308.8" y1="150" x2="308.8" y2="154"/>
<text class="s" x="308.8" y="167" text-anchor="middle">30 ms</text>
<line class="axis" x1="403.7" y1="150" x2="403.7" y2="154"/>
<text class="s" x="403.7" y="167" text-anchor="middle">40 ms</text>
<line class="axis" x1="498.7" y1="150" x2="498.7" y2="154"/>
<text class="s" x="498.7" y="167" text-anchor="middle">50 ms</text>
<line class="axis" x1="593.6" y1="150" x2="593.6" y2="154"/>
<text class="s" x="593.6" y="167" text-anchor="middle">60 ms</text>
<line class="axis" x1="688.5" y1="150" x2="688.5" y2="154"/>
