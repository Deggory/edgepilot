<rect x="322.9" y="186" width="11" height="11" rx="2" fill="#a371f7"/>
<text class="t" x="338.9" y="196">GDC warp, 1 ms</text>
<rect x="462.5" y="186" width="11" height="11" rx="2" fill="#2f81f7"/>
<text class="t" x="478.5" y="196">NPU (supercombo), 15.5 ms</text>
<rect x="24.0" y="208" width="11" height="11" rx="2" fill="#6e9fe6"/>
<text class="t" x="40.0" y="218">inputs + parse + publish, 3 ms</text>
<rect x="248.8" y="208" width="11" height="11" rx="2" fill="#f0883e"/>
<text class="t" x="264.8" y="218">wait for the next controlsd tick, ≤ 10 ms</text>
</svg>
